# Shared by every workspace member (none of them defines its own file).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    unawaited_futures: warning
  exclude:
    - "**/build/**"
    - "**/.dart_tool/**"
    - "**/*.g.dart"
    - "app/lib/l10n/gen/**"
    - "app/test/generated_migrations/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_statements
    - use_super_parameters
