name: Update goldens

# Renders golden baselines on Linux, the only platform they are compared on,
# and commits them to the branch the workflow runs on. Run it after an
# intentional UI change.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Prepare
        run: |
          flutter config --no-analytics && dart --disable-analytics
          flutter pub get
          flutter precache --universal --no-ios --no-web --no-linux --no-windows --no-macos

      - name: Render goldens
        working-directory: app
        run: flutter test --update-goldens --tags golden

      - name: Commit changed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/test/goldens
          if git diff --cached --quiet; then
            echo "Goldens already up to date."
          else
            git commit -m "Update golden baselines (rendered on Linux)"
            git push
          fi
