name: APK

# Every push to main produces an installable APK as a run artifact.
# Pushing a tag like v0.2.0 also publishes it as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only used to create releases for tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Disable analytics
        run: flutter config --no-analytics && dart --disable-analytics

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        # Signed with the debug key until release signing lands in M7:
        # installable for testing, not for Google Play.
        run: flutter build apk --release

      - name: Name the APK
        id: apk
        run: |
          version=$(grep '^version:' app/pubspec.yaml | sed 's/version: *//; s/+.*//')
          name="cashrotate-${version}-${GITHUB_SHA::7}.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "$name"
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.apk.outputs.name }}" "${{ steps.apk.outputs.name }}.sha256" \
            --title "$GITHUB_REF_NAME" \
            --notes "Test build signed with the debug key. Not for Google Play." \
            --prerelease
