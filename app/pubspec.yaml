name: cashrotate
description: Fixed-expense first budgeting app. Data stays on device and the user's own WebDAV.
publish_to: none
version: 0.7.1+3

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cashrotate_core:
    path: ../packages/core
  cashrotate_sync:
    path: ../packages/sync
  intl: ^0.20.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  material_ui: ^1.8.0
  drift: ^2.35.3
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  uuid: ^4.6.0
  sodium: ^4.1.2
  local_auth: ^3.0.2

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter

  meta: ^1.19.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/presets/presets.json
