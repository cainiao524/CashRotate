name: cashrotate_workspace
description: Workspace root for CashRotate. Not a package itself.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - app
  - packages/core
  - packages/sync

dev_dependencies:
  flutter_lints: ^6.0.0

# Encrypted SQLite for the local database (ADR 0003). Read by package:sqlite3's
# build hook for every member of the workspace.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
